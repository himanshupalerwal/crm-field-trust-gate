<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 714" width="880" height="714"><rect width="880" height="714" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8d87"/></marker></defs><text x="30" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">The gate reads metadata the CRM keeps, plus two fields you add</text><rect x="30" y="76" width="196" height="96" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="46" y="104" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Billing system</text><text x="46" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">integration user</text><text x="46" y="148" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">billing_sync</text><path d="M128.0 172V196" fill="none" stroke="#8f8d87" stroke-width="1.5"/><rect x="238" y="76" width="196" height="96" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="254" y="104" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Contract system</text><text x="254" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">integration user</text><text x="254" y="148" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">contract_sync</text><path d="M336.0 172V196" fill="none" stroke="#8f8d87" stroke-width="1.5"/><rect x="446" y="76" width="196" height="96" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="462" y="104" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Sales reps</text><text x="462" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">edit fields by</text><text x="462" y="148" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">hand in the UI</text><path d="M544.0 172V196" fill="none" stroke="#8f8d87" stroke-width="1.5"/><rect x="654" y="76" width="196" height="96" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="2"/><text x="670" y="104" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Renewal agent</text><text x="670" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">writes only after</text><text x="670" y="148" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">the gate approves</text><path d="M752.0 172V196" fill="none" stroke="#8f8d87" stroke-width="1.5"/><path d="M128.0 196H752.0" fill="none" stroke="#8f8d87" stroke-width="1.5"/><path d="M440 196V222" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="226" width="820" height="166" rx="10" fill="#f6f5f2" stroke="#8f8d87" stroke-width="1.25"/><text x="46" y="254" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">CRM record</text><rect x="46" y="270" width="188" height="106" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="62" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Field value</text><text x="62" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">what every API</text><text x="62" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">call returns</text><rect x="242" y="270" width="188" height="106" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="258" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Field history</text><text x="258" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">who changed it,</text><text x="258" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">when, old and new</text><rect x="438" y="270" width="188" height="106" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="454" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Sync timestamp</text><text x="454" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">you add it; set</text><text x="454" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">on every sync run</text><rect x="634" y="270" width="188" height="106" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="650" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Provenance</text><text x="650" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">you add it: agent,</text><text x="650" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">run, inputs, confirm</text><rect x="30" y="457" width="300" height="96" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="46" y="485" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Matching rules</text><text x="46" y="509" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">how many records</text><text x="46" y="529" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">match this customer</text><rect x="390" y="440" width="460" height="130" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="406" y="468" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">What the gate receives</text><text x="406" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">source_system: from the writer</text><text x="406" y="512" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">last_synced: from the sync timestamp</text><text x="406" y="532" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">last_writer: from history or provenance</text><text x="406" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">matches: from the matching rules</text><path d="M620 392V436" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M330 505H386" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="390" y="610" width="460" height="76" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="2"/><text x="620.0" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Field trust gate</text><text x="620.0" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">proceed, draft or ask</text><path d="M620 570V606" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/></svg>