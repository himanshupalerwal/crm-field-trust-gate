<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560"><rect width="880" height="560" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8d87"/></marker></defs><text x="30" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Only action-grade inputs can drive an autonomous write</text><rect x="30" y="236" width="170" height="76" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="115.0" y="264" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Renewal agent</text><text x="115.0" y="288" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">proposes a write</text><rect x="246" y="211" width="286" height="126" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="262" y="239" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Field trust gate</text><text x="262" y="263" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Authority: which system wins</text><text x="262" y="283" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Freshness: within its SLA</text><text x="262" y="303" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Identity: one resolved entity</text><text x="262" y="323" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Provenance: allowed writer?</text><rect x="578" y="76" width="272" height="96" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="714.0" y="104" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Ask</text><text x="714.0" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">a check failed: ask the</text><text x="714.0" y="148" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">user or the field's owner</text><rect x="578" y="236" width="272" height="96" rx="8" fill="#ffffff" stroke="#8f8d87" stroke-width="1.25"/><text x="714.0" y="264" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Draft</text><text x="714.0" y="288" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">an input is advisory:</text><text x="714.0" y="308" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">a human approves it</text><rect x="578" y="396" width="272" height="96" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="2"/><text x="714.0" y="424" font-family="Inter, DejaVu Sans, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Proceed</text><text x="714.0" y="448" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">all inputs action-grade:</text><text x="714.0" y="468" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">write and stamp it</text><path d="M200 274H242" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532 274H556V124H574" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532 274H574" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532 274H556V444H574" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M714.0 492V532H115V316" fill="none" stroke="#8f8d87" stroke-width="1.5" marker-end="url(#arrow)"/><text x="330" y="522" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="middle">stamped values read as advisory until confirmed</text></svg>